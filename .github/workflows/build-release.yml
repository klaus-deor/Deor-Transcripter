name: Build Release

# Tagging vX.Y.Z builds the Windows installer and publishes a release with it.
# Linux and macOS are only built on demand (workflow_dispatch with
# platforms: all), so a Windows-only release does not republish binaries for
# platforms that did not change.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      platforms:
        description: 'Which platforms to build'
        type: choice
        options:
          - windows
          - all
        default: windows

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libportaudio2 \
            portaudio19-dev \
            libgirepository1.0-dev \
            gir1.2-appindicator3-0.1 \
            libdbus-1-dev \
            libsecret-1-dev

      - name: Build .deb package (Python)
        run: |
          chmod +x packaging/linux/build_deb_python.sh
          ./packaging/linux/build_deb_python.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.deb
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pywin32

      - name: Build executable
        run: python scripts/build.py

      - name: Install WiX
        run: dotnet tool install --global wix --version 6.*

      - name: Build MSI installer
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = "${{ steps.ver.outputs.version }}"
          wix build packaging/windows/transcripter.wxs `
            -d Version=$version `
            -d ExePath=dist/Transcripter.exe `
            -o "dist/DeorTranscripter-$version-x64.msi"
          Get-ChildItem dist/*.msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.msi
          retention-days: 30

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install portaudio create-dmg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Create .icns from iconset
        run: iconutil -c icns packaging/macos/transcripter.iconset -o packaging/macos/transcripter.icns || true

      - name: Build executable
        run: python scripts/build.py

      - name: Create DMG
        run: |
          chmod +x packaging/macos/create_dmg.sh
          ./packaging/macos/create_dmg.sh || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.app
            dist/*.dmg
          retention-days: 30

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: List release files
        run: ls -la release/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Deor Transcripter v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Deor Transcripter v${{ steps.version.outputs.VERSION }}

            Windows-only release. Linux and macOS are unchanged — use the
            binaries from the previous release.

            ### Download

            | Platform | File | Installation |
            |----------|------|--------------|
            | **Windows** | `.msi` | Double-click to install, or `msiexec /i <file> /quiet` |

            If you have an older Windows build installed, uninstall it first:
            it was installed by a different installer and will not be replaced
            automatically.

            ### Requirements

            - **Windows**: Windows 10 or later

            ### Setup

            1. Get an API key from one of the providers:
               - [Groq](https://console.groq.com/) (recommended - free tier available)
               - [OpenAI](https://platform.openai.com/)
               - [AssemblyAI](https://www.assemblyai.com/)
               - [Deepgram](https://console.deepgram.com/)
               - [Google Cloud](https://console.cloud.google.com/)

            2. Open Deor Transcripter and go to **Settings**

            3. Enter your API key and select the provider

            ### Usage

            - Press `Ctrl+Alt+R` (default) to start/stop recording
            - Transcribed text is automatically copied to clipboard
